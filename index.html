<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quittance de Loyer</title>
<meta name="theme-color" content="#0d2145">
<meta name="application-name" content="Quittance de Loyer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quittance">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ea;--card:#fff;--text:#16213a;--mute:#6f7688;--navy:#0d2145;--pri:#0d2145;--ink:#16336b;--ink2:#2a4b93;--gold:#c9a24b;--gold2:#e4c06f;--line:#e8e3d4;--soft:#f8f5ec;--field:#fbfaf6;--bad:#b4382e;--sh:0 1px 2px rgba(13,33,69,.05),0 10px 28px rgba(13,33,69,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090f1f;--card:#111a2f;--text:#e8ebf4;--mute:#97a1bb;--navy:#0a1530;--pri:#2a4b93;--ink:#e4c06f;--ink2:#f0d58f;--line:#22304d;--soft:#16213b;--field:#0c1426;--bad:#ff8f80;--sh:none}}
:root[data-theme="dark"]{--bg:#090f1f;--card:#111a2f;--text:#e8ebf4;--mute:#97a1bb;--navy:#0a1530;--pri:#2a4b93;--ink:#e4c06f;--ink2:#f0d58f;--line:#22304d;--soft:#16213b;--field:#0c1426;--bad:#ff8f80;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.65 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(180deg,var(--navy),#0b1a38);color:#fff;box-shadow:0 4px 18px rgba(5,12,30,.25)}
.bar>div{max-width:1060px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#0d2145;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(201,162,75,.4)}
.brand b{font-size:18px;font-weight:700;display:block;line-height:1.25;letter-spacing:.2px}
.brand small{color:rgba(255,255,255,.62);font-size:12px;display:block;line-height:1.35}
.lang{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;flex:none}
.lang button{border:0;background:none;color:rgba(255,255,255,.72);padding:6px 11px;border-radius:8px;font:600 12.5px inherit;font-family:inherit;cursor:pointer;transition:.15s}
.lang button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405}
nav{display:flex;gap:2px}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 6px;border:0;border-bottom:3px solid transparent;background:none;color:rgba(255,255,255,.6);font:600 14px inherit;font-family:inherit;cursor:pointer;transition:.15s}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--gold2)}
nav svg{width:18px;height:18px}
main{max-width:1060px;margin:0 auto;padding:22px 18px 48px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.pvc{position:sticky;top:calc(124px + env(safe-area-inset-top,0px));background:var(--soft)}
@media(max-width:820px){.pvc{position:static}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh)}
.card h3{margin:0 0 6px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px}
.card h3::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.grp{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--mute);margin:20px 0 2px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.grp:first-of-type{margin-top:12px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--field);color:var(--text);font:inherit;min-height:46px;transition:.15s}
input:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.24)}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chk label{display:flex;gap:8px;align-items:center;margin:0;padding:9px 13px;border:1px solid var(--line);border-radius:11px;color:var(--text);font-size:13px;cursor:pointer;background:var(--field)}
.chk label:has(input:checked){border-color:var(--gold);background:rgba(201,162,75,.14)}
.chk input{width:auto;min-height:0;accent-color:var(--gold)}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:11px 16px;border-radius:14px;background:linear-gradient(135deg,var(--navy),#16336b);color:#fff;box-shadow:0 8px 20px rgba(13,33,69,.22)}
.tot span{color:rgba(255,255,255,.72);font-weight:600;font-size:13px}
.tot b{font-size:22px;color:var(--gold2);letter-spacing:.3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1px solid var(--pri);border-radius:12px;background:var(--pri);color:#fff;font:600 14px inherit;font-family:inherit;cursor:pointer;text-decoration:none;min-height:44px;box-shadow:0 1px 2px rgba(13,33,69,.18);transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.big{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:#b8913a;color:#1a1405;font-size:16px;min-height:50px;box-shadow:0 8px 18px rgba(201,162,75,.35)}
.btn.alt{background:var(--card);color:var(--text);border-color:var(--line);box-shadow:none}
.btn.alt:hover{border-color:var(--gold);filter:none}
.btn.del{background:transparent;color:var(--bad);border-color:var(--line);box-shadow:none}
.btn.del.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:13px;min-height:34px;border-radius:9px}
.main-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.main-acts .big{grid-column:1/-1}
.main-acts .alt{padding:10px 6px;font-size:13px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.item{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.who{display:flex;align-items:center;gap:12px;flex:1 1 220px;min-width:0}
.who b{display:block;line-height:1.35}.who small{color:var(--mute);display:block;overflow-wrap:anywhere}
.av{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--ink);display:grid;place-items:center;font:700 14px inherit;flex:none;border:1px solid var(--line)}
.ia{display:flex;gap:6px;align-items:center;margin-inline-start:auto;flex-wrap:wrap}
.ia .del{margin-inline-start:10px}
.empty{color:var(--mute);text-align:center;padding:34px 12px;border:1.5px dashed var(--line);border-radius:14px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stats div{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.stats small{color:var(--mute);display:block;font-size:12px;font-weight:600}.stats b{font-size:22px;color:var(--text);line-height:1.4}
@media(max-width:480px){.stats b{font-size:17px}.brand small{display:none}.lang button{padding:6px 8px}}
hr{border:0;border-top:1px solid var(--line);margin:20px 0 0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border:1px solid var(--gold);padding:11px 20px;border-radius:26px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1}
.md{position:fixed;inset:0;background:rgba(6,12,28,.6);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:20}
.md.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h3{margin:0 0 12px;color:var(--text);font-size:17px}
.sheet textarea{width:100%;height:160px;direction:ltr;text-align:left;font:13px/1.55 ui-monospace,Menlo,monospace;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);resize:vertical}
.shg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pvc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
.pvc summary::-webkit-details-marker{display:none}
.pvc summary::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.pvc summary::after{content:"\25BE";margin-inline-start:auto;color:var(--mute);transition:transform .2s}
.pvc details[open] summary::after{transform:rotate(180deg)}
@media(max-width:480px){.row3{gap:8px}.row3 input{padding:11px 9px}}
.pvc .pv{box-shadow:0 2px 6px rgba(13,33,69,.1),0 14px 34px rgba(13,33,69,.16)}
.pv{overflow:hidden;direction:ltr;border-radius:10px}
.rc{direction:ltr;text-align:left;background:#fff;color:#1f3a9e;border:1px solid #cfd3e6;padding:16px 18px;font:500 14px/1.9 "Archivo Narrow",Arial,sans-serif;width:680px}
.rc .top{display:flex;justify-content:space-between;align-items:flex-start;padding:0}
.rc h2{margin:0;font:700 20px "Archivo Narrow",Arial,sans-serif;letter-spacing:.3px}
.rc .no{border:1.5px solid #1f3a9e;padding:0 10px;min-width:70px;text-align:center;display:inline-block}
.rc .f{border-bottom:1px dotted #1f3a9e;padding:0 4px;font-weight:700;color:#10206b}
.rc table{border:1.5px solid #1f3a9e;border-collapse:collapse;margin:8px 0;width:62%}
.rc td{border:1px solid #1f3a9e;padding:1px 8px}
.rc td:last-child{text-align:right;font-weight:700;color:#10206b}
.rc .nota{font-size:10.5px;line-height:1.35;margin-top:6px}
#printArea{display:none}
@media print{body{background:#fff}body::before,.bar,main,.toast,.md{display:none!important}#printArea{display:block}#printArea .rc{border:2px solid #1f3a9e;width:auto;font-size:15px}@page{size:A4 landscape;margin:12mm}}
</style>
</head>
<body>
<header class="bar"><div>
 <div class="top">
  <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></div>
   <div><b data-i="app"></b><small data-i="tag"></small></div></div>
  <div class="lang" id="lang"><button data-l="ar">العربية</button><button data-l="fr">Français</button><button data-l="wo">Wolof</button></div>
 </div>
 <nav id="nav">
  <button data-t="new" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i="tNew"></span></button>
  <button data-t="ten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></svg><span data-i="tTen"></span></button>
  <button data-t="his"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span data-i="tHis"></span></button>
 </nav>
</div></header>

<main>
 <section id="t-new">
  <div class="grid">
   <div class="card">
    <h3 data-i="fTitle"></h3>
    <div class="row"><div><label data-i="lSel"></label><select id="ten"></select></div><div><label data-i="lEmail"></label><input type="email" id="email" inputmode="email" autocomplete="off"></div></div>
    <div class="row">
     <div><label data-i="lName"></label><input id="name" autocomplete="off"></div>
     <div><label data-i="lAddr"></label><input id="addr" autocomplete="off"></div>
    </div>
    <div class="row">
     <div><label data-i="lPer"></label><select id="per"><option value="mois" data-i="pm"></option><option value="trimestre" data-i="pt"></option><option value="semestre" data-i="ps"></option><option value="an" data-i="pa"></option></select></div>
     <div><label data-i="lDate"></label><input type="date" id="dt"></div>
    </div>
    <div class="row">
     <div><label data-i="lFrom"></label><input type="date" id="d1"></div>
     <div><label data-i="lTo"></label><input type="date" id="d2"></div>
    </div>
    <div class="row3">
     <div><label data-i="lLoy"></label><input type="number" id="loy" min="0" inputmode="decimal"></div>
     <div><label data-i="lPre"></label><input type="number" id="pre" min="0" inputmode="decimal"></div>
     <div><label data-i="lTim"></label><input type="number" id="tim" min="0" inputmode="decimal"></div>
    </div>
    <div class="chk">
     <label><input type="checkbox" id="tom"> T.O.M. 3,6%</label>
     <label><input type="checkbox" id="tlv"> T.L.V. 5%</label>
     <label><input type="checkbox" id="tva"> T.V.A. 18%</label>
    </div>
    <label data-i="lNo"></label><input id="no">
    <div class="tot"><span data-i="kTotal"></span><b id="totv">0</b></div>
    <div class="main-acts">
     <button class="btn big" id="saveP" data-i="bSaveP"></button>
     <button class="btn alt" id="save" data-i="bSave"></button>
     <button class="btn alt" id="saveS" data-i="bSaveS"></button>
     <button class="btn alt" id="reset" data-i="bReset"></button>
    </div>
   </div>
   <div class="card pvc">
    <details id="pvd" open>
     <summary data-i="pvTitle"></summary>
     <div class="pv" id="preview" style="margin-top:12px"></div>
     <p style="color:var(--mute);font-size:12.5px;margin:10px 0 0" data-i="pvNote"></p>
    </details>
    <button class="btn" id="imgP" data-i="bImg" style="width:100%;margin-top:14px"></button>
   </div>
  </div>
 </section>

 <section id="t-ten" hidden>
  <div class="grid">
   <div class="card">
    <h3 data-i="tnTitle"></h3>
    <label data-i="lName"></label><input id="tn">
    <label data-i="lAddr"></label><input id="ta">
    <label data-i="lEmail"></label><input type="email" id="te" inputmode="email" autocomplete="off">
    <div class="row">
     <div><label data-i="lDefL"></label><input type="number" id="tl" min="0"></div>
     <div><label data-i="lDefP"></label><input type="number" id="tp" min="0"></div>
    </div>
    <div class="acts"><button class="btn" id="tsave" data-i="bTSave"></button><button class="btn alt" id="tclear" data-i="bTClear"></button></div>
    <hr>
    <div class="grp" data-i="sSet"></div>
    <div class="row">
     <div><label data-i="lCur"></label><input id="cur"></div>
     <div><label data-i="lLord"></label><input id="lord"></div>
    </div>
    <div class="grp" data-i="sBk"></div>
    <label data-i="lBkMail"></label><input id="bkMail" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" dir="ltr">
    <div class="acts" style="margin-top:12px"><button class="btn" id="bkMailB" data-i="bBkMail" style="flex:1 1 100%"></button><button class="btn alt" id="bkExp" data-i="bBkExp"></button><button class="btn alt" id="bkImpB" data-i="bBkImp"></button><input type="file" id="bkImp" accept=".json,application/json" hidden></div>
    <p id="bkLast" style="margin:12px 0 0;font-weight:600;font-size:13px"></p>
    <p style="color:var(--mute);font-size:12.5px;margin:4px 0 0" data-i="bkNote"></p>
   </div>
   <div class="card"><h3 data-i="tlTitle"></h3><div id="tlist"></div></div>
  </div>
 </section>

 <section id="t-his" hidden>
  <div class="stats">
   <div><small data-i="sN"></small><b id="sN">0</b></div>
   <div><small data-i="sT"></small><b id="sT">0</b></div>
   <div><small data-i="tTen"></small><b id="sK">0</b></div>
  </div>
  <div class="card">
   <input id="q" data-ph="qPh" autocomplete="off">
   <div id="hlist"></div>
  </div>
 </section>
</main>

<div id="printArea"></div>
<div class="md" id="shm"><div class="sheet" role="dialog" data-al="shTitle">
 <h3 data-i="shTitle"></h3>
 <textarea id="shtxt" readonly></textarea>
 <div class="shg" id="shg"></div>
 <button class="btn alt" id="shx" style="width:100%" data-i="bClose"></button>
</div></div>
<div class="md" id="imgm"><div class="sheet" role="dialog" data-al="iTitle">
 <h3 data-i="iTitle"></h3>
 <img id="imgv" alt="" style="width:100%;border:1px solid var(--line);border-radius:8px;background:#fff">
 <p style="color:var(--mute);font-size:12.5px;margin:8px 0" data-i="iHint"></p>
 <div class="shg"><button class="btn" id="imgSave" data-i="bImgSave"></button><button class="btn alt" id="imgShare" data-i="bShare"></button></div>
 <button class="btn alt" id="imgx" style="width:100%" data-i="bClose"></button>
</div></div>
<div class="toast" id="toast"></div>

/* ---------- French number to words ---------- */
function fr(n){n=Math.floor(n);if(n===0)return"zéro";
const u=["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"],tn=["","","vingt","trente","quarante","cinquante","soixante"];
const b100=(n,last)=>{if(n<20)return u[n];if(n<70){const d=Math.floor(n/10),r=n%10;return tn[d]+(r===1?" et un":r?"-"+u[r]:"")}
if(n<80){const r=n-60;return"soixante"+(r===11?" et onze":"-"+u[r])}if(n===80)return last?"quatre-vingts":"quatre-vingt";return"quatre-vingt-"+u[n-80]};
const b1000=(n,last)=>{const h=Math.floor(n/100),r=n%100;let s="";if(h){s=h===1?"cent":u[h]+" cent";if(h>1&&r===0&&last)s+="s"}if(r)s+=(s?" ":"")+b100(r,last);return s};
const o=[],mi=Math.floor(n/1e6)%1000,th=Math.floor(n/1000)%1000,rest=n%1000;
if(mi)o.push(b1000(mi,false)+" million"+(mi>1?"s":""));
if(th)o.push(th===1?"mille":b1000(th,false)+" mille");
if(rest)o.push(b1000(rest,true));return o.join(" ")}

function calc(r){const l=+r.loy||0,p=+r.pre||0,tm=r.tom?l*.036:0,tl=r.tlv?l*.05:0,tv=r.tva?(l+p)*.18:0,ti=+r.tim||0;return{l,p,tm,tl,tv,ti,total:l+p+tm+tl+tv+ti}}

/* ---------- receipt (always French, like the booklet) ---------- */
function rcpt(r){const c=calc(r),cur=db.cfg.cur||"";
const words=c.total?fr(c.total)+" "+esc(cur):"";
const F=(v,w)=>`<span class="f" style="display:inline-block;min-width:${w||80}px">${esc(v)||"&nbsp;"}</span>`;
const row=(a,v)=>`<tr><td>${a}</td><td>${v?fmt(v):""}</td></tr>`;
return`<div class="rc">
<div class="top"><div>F ${F("",60)}</div><h2>QUITTANCE DE LOYER</h2></div>
<div style="text-align:right">N° <span class="no">${esc(r.no)||"&nbsp;"}</span></div>
<div>Reçu de M ${F(r.name,300)}</div>
<div>La somme de ${F(words,300)}</div>
<div>Pour le montant d’un ${F(r.per,90)} de loyer des locaux qu’il occupe dans la maison située ${F(r.addr,200)}</div>
<div>le dit commençant le ${F(fd(r.d1),110)} et finissant le ${F(fd(r.d2),110)} sous réserves de droit</div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">
<table><tbody>${row("Loyer",c.l)}${row("Prestations",c.p)}${row("T.O.M. 3,6%",c.tm)}${row("T.L.V. 5%",c.tl)}${row("T.V.A. 18%",c.tv)}${row("Timbre",c.ti)}<tr><td><b>Total</b></td><td>${c.total?fmt(c.total):""}</td></tr></tbody></table>
<div style="flex:1"><b>DONT QUITTANCE</b><div>Le ${F(fd(r.dt),120)}</div>${db.cfg.lord?`<div style="margin-top:6px">${esc(db.cfg.lord)}</div>`:""}</div></div>
<div class="nota"><b>NOTA</b> – Un locataire ne peut déménager : 1 - Qu’il n’ait justifié au propriétaire par une quittance du percepteur qu’il acquitte toutes ses contributions personnelles et mobilières de l’année courante. 2 - Qu’il n’est donné ou reçu congé par écrit dans les délais prescrits. 3 - Qu’il n’ait fait faire toutes les réparations locatives à sa charge suivant l’usage ou d’après l’état des lieux s’il en existe un : il ne pourra sous louer en tout ou en partie des locaux cédés sans le consentement du propriétaire.</div></div>`}

/* ---------- new receipt form ---------- */
const today=()=>new Date().toISOString().slice(0,10);
const nextNo=()=>String(db.receipts.reduce((m,r)=>Math.max(m,parseInt(r.no)||0),0)+1).padStart(4,"0");
const ids=["name","addr","email","per","dt","d1","d2","loy","pre","tim","no"];
function form(){const r={};ids.forEach(i=>r[i]=$(i).value);r.tom=$("tom").checked;r.tlv=$("tlv").checked;r.tva=$("tva").checked;r.tenant=$("ten").value;return r}
function setForm(r){ids.forEach(i=>$(i).value=r[i]??"");$("tom").checked=!!r.tom;$("tlv").checked=!!r.tlv;$("tva").checked=!!r.tva;$("ten").value=r.tenant||"";prev()}
function blank(){setForm({dt:today(),per:"mois",no:nextNo(),tenant:""})}
function prev(){const r=form();$("preview").innerHTML=rcpt(r);fit();$("totv").textContent=fmt(calc(r).total)+" "+(db.cfg.cur||"")}
const MN={mois:1,trimestre:3,semestre:6,an:12};
function autoEnd(){const v=$("d1").value;if(!v)return;const x=new Date(v);x.setMonth(x.getMonth()+(MN[$("per").value]||1));x.setDate(x.getDate()-1);$("d2").value=x.toISOString().slice(0,10)}
$("ten").onchange=()=>{const x=db.tenants.find(z=>z.id===$("ten").value);if(x){$("name").value=x.name;$("addr").value=x.addr;$("email").value=x.email||"";$("loy").value=x.loy||"";$("pre").value=x.pre||""}prev()};
ids.concat(["tom","tlv","tva"]).forEach(i=>$(i).addEventListener("input",prev));
$("per").onchange=()=>{autoEnd();prev()};$("d1").onchange=()=>{autoEnd();prev()};
function commit(){const r=form();if(!r.name.trim()||!calc(r).total){toast("tNeed");return null}
r.id=uid();r.total=calc(r).total;if(db.receipts.some(x=>x.no===r.no)){r.no=nextNo();$("no").value=r.no}
db.receipts.unshift(r);save();renderHis();return r}
function printR(r){$("printArea").innerHTML=rcpt(r);try{window.print()}catch(e){toast("tNoPrint")}}
$("save").onclick=()=>{if(commit()){toast("tSaved");blank()}};
$("saveP").onclick=()=>{const r=commit();if(r){printR(r);blank()}};
$("saveS").onclick=()=>{const r=commit();if(r){blank();openShare(r)}};
$("reset").onclick=blank;

/* ---------- two-step delete (no browser popups) ---------- */
function armDel(b,fn){if(b.dataset.arm){fn();return}b.dataset.arm=1;b.classList.add("arm");b.textContent=t("bSure");setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.classList.remove("arm");b.textContent=t("bDel")}},3000)}

/* ---------- tenants ---------- */
let editId=null;
function fillTenants(){const s=$("ten"),v=s.value;s.innerHTML=`<option value="">${t("oSel")}</option>`+db.tenants.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");s.value=v}
function renderTen(){$("tlist").innerHTML=db.tenants.length?db.tenants.map(x=>`<div class="item"><div class="who"><span class="av">${esc(ini(x.name))}</span><span><b>${esc(x.name)}</b><small>${esc(x.addr)}${x.loy?" · "+fmt(+x.loy):""}${x.email?" · "+esc(x.email):""}</small></span></div><div class="ia"><button class="btn sm" data-use="${x.id}">${t("bUse")}</button><button class="btn alt sm" data-ed="${x.id}">${t("bEdit")}</button><button class="btn del sm" data-rm="${x.id}">${t("bDel")}</button></div></div>`).join(""):`<div class="empty">${t("eTen")}</div>`;fillTenants();$("sK").textContent=db.tenants.length}
$("tlist").onclick=e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.rm)armDel(b,()=>{db.tenants=db.tenants.filter(x=>x.id!==b.dataset.rm);save();renderTen()});
if(b.dataset.ed){const x=db.tenants.find(z=>z.id===b.dataset.ed);editId=x.id;$("tn").value=x.name;$("ta").value=x.addr;$("tl").value=x.loy;$("tp").value=x.pre;$("te").value=x.email||"";$("tn").focus()}
if(b.dataset.use){tab("new");$("ten").value=b.dataset.use;$("ten").onchange()}};
const clr=()=>{editId=null;["tn","ta","te","tl","tp"].forEach(i=>$(i).value="")};
$("tclear").onclick=clr;
$("tsave").onclick=()=>{const n=$("tn").value.trim();if(!n){toast("tNeedName");return}
const x={id:editId||uid(),name:n,addr:$("ta").value.trim(),email:$("te").value.trim(),loy:$("tl").value,pre:$("tp").value};
db.tenants=editId?db.tenants.map(z=>z.id===editId?x:z):db.tenants.concat(x);clr();save();renderTen();toast("tTenSaved")};
$("cur").oninput=()=>{db.cfg.cur=$("cur").value;save();prev();renderHis()};
$("lord").oninput=()=>{db.cfg.lord=$("lord").value;save();prev()};

/* ---------- history ---------- */
function renderHis(){const q=$("q").value.trim().toLowerCase();
const L=db.receipts.filter(r=>!q||(r.name||"").toLowerCase().includes(q)||(r.no||"").includes(q));
$("sN").textContent=db.receipts.length;$("sT").textContent=fmt(db.receipts.reduce((s,r)=>s+(+r.total||0),0))+" "+(db.cfg.cur||"");
$("hlist").innerHTML=L.length?L.map(r=>`<div class="item"><div class="who"><span class="av">${esc(ini(r.name))}</span><span><b>N° ${esc(r.no)} · ${esc(r.name)}</b><small>${fd(r.dt)} · ${fmt(r.total)} ${esc(db.cfg.cur)} · ${t(PK[r.per]||"pm")}</small></span></div><div class="ia"><button class="btn sm" data-p="${r.id}">${t("bPrint")}</button><button class="btn alt sm" data-s="${r.id}">${t("bShare")}</button><button class="btn alt sm" data-g="${r.id}">${t("bImgS")}</button><button class="btn alt sm" data-o="${r.id}">${t("bOpen")}</button><button class="btn del sm" data-d="${r.id}">${t("bDel")}</button></div></div>`).join(""):`<div class="empty">${t("eHis")}</div>`}
$("q").oninput=renderHis;
$("hlist").onclick=e=>{const b=e.target.closest("button");if(!b)return;const g=id=>db.receipts.find(r=>r.id===id);

if(b.dataset.s)openShare(g(b.dataset.s));

if(b.dataset.d)armDel(b,()=>{db.receipts=db.receipts.filter(r=>r.id!==b.dataset.d);save();renderHis()})};

const L=[`QUITTANCE DE LOYER N° ${r.no}`,`Reçu de M. ${r.name}`,`Somme : ${fmt(c.total)} ${cur} (${fr(c.total)} ${cur})`];
if(r.addr)L.push(`Locaux : ${r.addr}`);
if(r.d1||r.d2)L.push(`Période (${r.per}) : du ${fd(r.d1)} au ${fd(r.d2)}`);
L.push("");[["Loyer",c.l],["Prestations",c.p],["T.O.M. 3,6%",c.tm],["T.L.V. 5%",c.tl],["T.V.A. 18%",c.tv],["Timbre",c.ti]].forEach(([k,v])=>{if(v)L.push(`${k} : ${fmt(v)}`)});
L.push(`Total : ${fmt(c.total)} ${cur}`,"",`Fait le ${fd(r.dt)}`);if(db.cfg.lord)L.push(db.cfg.lord);return L.join("\n")}
let shR=null;

$("shg").innerHTML=(navigator.share?`<button class="btn" data-a="n">${t("bNat")}</button>`:"")+`<a class="btn alt" href="https://wa.me/?text=${e}" target="_blank" rel="noopener">${t("bWa")}</a><a class="btn alt" href="sms:?&body=${e}">${t("bSms")}</a><a class="btn alt" href="mailto:${(shR.email||"").replace(/[^\w.@+\-]/g,"")}?subject=${encodeURIComponent("Quittance de loyer N° "+shR.no)}&body=${e}">${t("bMail")}</a><button class="btn alt" data-a="c">${t("bCopy")}</button>`}
function openShare(r){if(!r)return;shR=r;$("shtxt").value=shareText(r);shGrid();$("shm").classList.add("on")}
$("shg").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const x=$("shtxt").value;
if(b.dataset.a==="n"){try{await navigator.share({title:"Quittance de loyer",text:x})}catch(err){if(err.name!=="AbortError")toast("tNoShare")}}
if(b.dataset.a==="c"){let ok=false;try{await navigator.clipboard.writeText(x);ok=true}catch(err){try{$("shtxt").select();ok=document.execCommand("copy")}catch(z){}}toast(ok?"tCopied":"tManual")}};

/* ---------- fit preview to screen width ---------- */
function fit(){const p=$("preview"),w=p.querySelector(".rc");if(!w)return;w.style.transform="";p.style.height="";const W=p.clientWidth;if(!W)return;const s=Math.min(1,W/680);w.style.transformOrigin="top left";w.style.transform=`scale(${s})`;p.style.height=Math.ceil(w.offsetHeight*s)+"px"}
addEventListener("resize",fit);

/* ---------- save receipt as image (PNG) ---------- */
function rcImage(r){const c=calc(r),cur=db.cfg.cur||"",W=680,S=2,INK="#1f3a9e",VAL="#10206b";
const d=document.createElement("div");d.innerHTML=rcpt(r);const nota=d.querySelector(".nota").textContent;
const cv=document.createElement("canvas"),x=cv.getContext("2d");
const FONT=s=>`${s}px "Archivo Narrow","Arial Narrow",Arial,sans-serif`;
x.font=FONT(10);const lines=[];let ln="";nota.split(" ").forEach(w=>{const s=ln?ln+" "+w:w;if(x.measureText(s).width>632&&ln){lines.push(ln);ln=w}else ln=s});lines.push(ln);
const H=446+lines.length*13+14;cv.width=W*S;cv.height=H*S;x.scale(S,S);

let imgBlob=null,imgName="quittance.png";
const getDl=()=>window.claude&&claude.use?claude.use("downloads").catch(()=>null):Promise.resolve(null);
async function openImg(r){if(!r)return;const cv=rcImage(r);imgName="quittance-"+String(r.no||"1").replace(/[^\w-]/g,"")+".png";
imgBlob=await new Promise(res=>cv.toBlob(res,"image/png"));$("imgv").src=cv.toDataURL("image/png");$("imgShare").style.display=navigator.share?"":"none";$("imgm").classList.add("on")}
$("imgP").onclick=()=>openImg(form());
$("pvd").addEventListener("toggle",fit);if(innerWidth<=820)$("pvd").open=false;
$("imgSave").onclick=async()=>{const dl=await getDl();if(!imgBlob){toast("tImgFail");return}if(!dl){const u=URL.createObjectURL(imgBlob),a=document.createElement("a");a.href=u;a.download=imgName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("tImgSaved");return}
try{await dl.save({filename:imgName,data:imgBlob});toast("tImgSaved")}catch(e){if(!e||e.code!=="declined")toast("tImgFail")}};
$("imgShare").onclick=async()=>{try{const f=new File([imgBlob],imgName,{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast("tImgFail")}catch(e){if(e.name!=="AbortError")toast("tImgFail")}};
$("imgx").onclick=()=>$("imgm").classList.remove("on");
$("imgm").onclick=e=>{if(e.target.id==="imgm")$("imgm").classList.remove("on")};

/* ---------- backup / restore ---------- */
async function saveBlob(blob,name){const dl=await getDl();if(dl){try{await dl.save({filename:name,data:blob});return true}catch(e){return false}}
const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}
$("bkExp").onclick=async()=>{const b=new Blob([JSON.stringify({app:"quittance",v:1,date:new Date().toISOString(),data:db},null,1)],{type:"application/json"});const ok=await saveBlob(b,"quittance-backup-"+today()+".json");if(ok)markBk();toast(ok?"tBkOk":"tImgFail")};
$("bkImpB").onclick=()=>$("bkImp").click();
$("bkImp").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
try{const o=JSON.parse(await f.text()),d=o.data||o;if(!Array.isArray(d.tenants)||!Array.isArray(d.receipts))throw 0;
const ti=new Set(db.tenants.map(x=>x.id)),ri=new Set(db.receipts.map(x=>x.id));
d.tenants.forEach(x=>{if(x&&x.id&&!ti.has(x.id))db.tenants.push(x)});d.receipts.forEach(x=>{if(x&&x.id&&!ri.has(x.id))db.receipts.push(x)});
db.receipts.sort((a,b)=>(b.dt||"").localeCompare(a.dt||"")||(b.no||"").localeCompare(a.no||""));save();renderTen();renderHis();toast("tBkImp")}catch(err){toast("tBkBad")}};

/* ---------- backup by e-mail ---------- */
function renderBk(){const e=$("bkLast");if(e)e.textContent=db.cfg.lastBk?t("bkLast")+" "+fd(db.cfg.lastBk):t("bkNever")}
function markBk(){db.cfg.lastBk=today();save();renderBk()}
$("bkMail").value=db.cfg.bkMail||"";$("bkMail").oninput=()=>{db.cfg.bkMail=$("bkMail").value.trim();save()};
$("bkMailB").onclick=async()=>{
const json=JSON.stringify({app:"quittance",v:1,date:new Date().toISOString(),data:db}),name="quittance-backup-"+today()+".json",to=(db.cfg.bkMail||"").trim(),sub="Quittance de Loyer - sauvegarde "+today();
try{const f=new File([json],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:sub,text:sub});markBk();return}}catch(e){if(e&&e.name==="AbortError")return}
await saveBlob(new Blob([json],{type:"application/json"}),name);
location.href="mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(t("mBody"));markBk()};
/* ---------- tabs & language ---------- */
function tab(k){["new","ten","his"].forEach(x=>$("t-"+x).hidden=x!==k);document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===k));if(k==="his")renderHis();if(k==="new")fit();scrollTo(0,0)}

function applyLang(){const h=document.documentElement;h.lang=lang;h.dir=lang==="ar"?"rtl":"ltr";document.title=t("app");

renderTen();renderHis();shGrid();renderBk()}
$("lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;db.cfg.lang=lang;save();applyLang()};
